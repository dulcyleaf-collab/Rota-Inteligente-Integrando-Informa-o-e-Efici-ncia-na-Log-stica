<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rota Inteligente — App do Motorista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

  <!-- Status Bar de Conexão -->
  <div id="status-bar-driver" class="w-full py-1.5 px-4 text-[11px] font-semibold text-center flex items-center justify-center gap-2 bg-emerald-950 text-emerald-300 border-b border-emerald-800 transition-colors duration-300">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
    <span id="status-text-driver">Modo Online — Dados Sincronizados</span>
  </div>

  <!-- Cabeçalho Mobile -->
  <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/80 p-4 sticky top-0 z-10 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center">
        <i class="fa-solid fa-id-card text-sm"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm text-white">Minhas Entregas</h1>
        <p class="text-[11px] text-slate-400" id="driver-info">Motorista: MOT-1042</p>
      </div>
    </div>
    <a href="index.html" class="text-xs text-slate-400 hover:text-white transition-colors flex items-center gap-1">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Sair</span>
    </a>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 p-4 space-y-4 max-w-md mx-auto w-full">

    <!-- Card Resumo da Rota -->
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 space-y-3 shadow-lg">
      <div class="flex justify-between items-center text-xs">
        <span class="text-slate-400">Progresso da Rota</span>
        <span id="progresso-texto" class="font-semibold text-blue-400">0 de 0 concluídas</span>
      </div>
      <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden">
        <div id="bar-progresso" class="h-full bg-blue-500 rounded-full transition-all duration-300" style="width: 0%;"></div>
      </div>
      <div class="flex justify-between text-[11px] text-slate-400 pt-1 border-t border-slate-700/40">
        <span>Criada em: <strong id="data-rota" class="text-slate-200">Nenhum dado</strong></span>
        <span>Veículo: <strong id="veiculo-rota" class="text-slate-200">-</strong></span>
      </div>
    </div>

    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-1">Sequência de Paradas</h2>

    <!-- Lista Dinâmica de Entregas -->
    <div id="lista-entregas" class="space-y-3">
      <!-- As entregas serão renderizadas via JavaScript -->
    </div>

  </main>

  <!-- Rodapé Móvel -->
  <footer class="p-4 bg-slate-900 border-t border-slate-700/80 text-center">
    <p class="text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
      <i class="fa-solid fa-database text-blue-400"></i>
      <span>Dados gravados e sincronizados via IndexedDB/localStorage</span>
    </p>
  </footer>

  <script>
    const todaseEntregas = {
      'NF-1042': { cliente: 'Distribuidora Silva', destino: 'Goiânia - GO', vol: '1.2 m³ / 350 kg', restricao: 'Recebe até 12h', restricaoCor: 'amber' },
      'NF-1043': { cliente: 'Embalagens Central', destino: 'Aparecida - GO', vol: '3.5 m³ / 890 kg', restricao: 'Sem restrição', restricaoCor: 'blue' },
      'NF-1044': { cliente: 'Indústria Sul', destino: 'Anápolis - GO', vol: '2.1 m³ / 500 kg', restricao: 'Apenas VUC', restricaoCor: 'red' }
    };

    function carregarRota() {
      const rotaSalva = localStorage.getItem('rota_ativa');
      const container = document.getElementById('lista-entregas');
      container.innerHTML = '';

      let pedidosParaExibir = ['NF-1042', 'NF-1043', 'NF-1044']; // Padrão
      if (rotaSalva) {
        const dados = JSON.parse(rotaSalva);
        pedidosParaExibir = dados.pedidos;
        document.getElementById('driver-info').innerText = `Motorista: ${dados.motorista}`;
        document.getElementById('data-rota').innerText = dados.dataCriacao;
        document.getElementById('veiculo-rota').innerText = dados.veiculo.toUpperCase();
      }

      let concluidas = 0;

      pedidosParaExibir.forEach((nf, index) => {
        const item = todaseEntregas[nf] || { cliente: 'Cliente Genérico', destino: 'Centro', vol: '1.0 m³', restricao: 'Nenhuma', restricaoCor: 'blue' };
        const statusEntrega = localStorage.getItem(`status_${nf}`) || 'PENDENTE';

        if (statusEntrega === 'ENTREGUE') concluidas++;

        const isEntregue = statusEntrega === 'ENTREGUE';

        const cardHTML = `
          <div class="bg-slate-800/80 border ${isEntregue ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-slate-700/60'} rounded-2xl p-4 space-y-3 transition-all">
            <div class="flex items-start justify-between">
              <div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded ${isEntregue ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-700 text-slate-300'}">Parada #${index + 1}</span>
                <h3 class="font-bold text-sm text-white mt-1">${nf} — ${item.cliente}</h3>
                <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot text-red-400 mr-1"></i>${item.destino}</p>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded bg-${item.restricaoCor}-500/10 text-${item.restricaoCor}-400 border border-${item.restricaoCor}-500/20 font-medium">
                ${item.restricao}
              </span>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-700/40 text-xs">
              <span class="text-slate-400">${item.vol}</span>
              ${isEntregue 
                ? '<span class="text-xs font-semibold text-emerald-400 flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> Entregue</span>'
                : `<button onclick="confirmarEntrega('${nf}')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white rounded-lg font-medium text-xs shadow-md transition-all flex items-center gap-1.5">
                     <i class="fa-solid fa-check"></i> Confirmar
                   </button>`
              }
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });

      // Atualiza progresso
      const total = pedidosParaExibir.length;
      const pct = Math.round((concluidas / total) * 100) || 0;
      document.getElementById('progresso-texto').innerText = `${concluidas} de ${total} concluídas`;
      document.getElementById('bar-progresso').style.width = `${pct}%`;
    }

    function confirmarEntrega(nf) {
      localStorage.setItem(`status_${nf}`, 'ENTREGUE');
      alert(`Entrega da ${nf} confirmada com sucesso!\nStatus atualizado no aplicativo.`);
      carregarRota();
    }

    function updateOnlineStatusDriver() {
      const statusBar = document.getElementById('status-bar-driver');
      const statusText = document.getElementById('status-text-driver');
      if (navigator.onLine) {
        statusBar.className = 'w-full py-1.5 px-4 text-[11px] font-semibold text-center flex items-center justify-center gap-2 bg-emerald-950 text-emerald-300 border-b border-emerald-800 transition-colors duration-300';
        statusText.innerText = 'Modo Online — Dados Sincronizados';
      } else {
        statusBar.className = 'w-full py-1.5 px-4 text-[11px] font-semibold text-center flex items-center justify-center gap-2 bg-amber-950 text-amber-300 border-b border-amber-800 transition-colors duration-300';
        statusText.innerText = 'Modo Offline — Alterações Salvas Localmente';
      }
    }

    window.addEventListener('online', updateOnlineStatusDriver);
    window.addEventListener('offline', updateOnlineStatusDriver);
    updateOnlineStatusDriver();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado:', reg))
          .catch(err => console.error('Erro no Service Worker:', err));
      });
    }

    window.onload = carregarRota;
  </script>
</body>
</html>
