<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rota Inteligente — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

  <!-- Status Bar de Conexão (Rede / Offline) -->
  <div id="status-bar" class="w-full py-1.5 px-4 text-xs font-semibold text-center flex items-center justify-center gap-2 bg-emerald-950 text-emerald-300 border-b border-emerald-800 transition-colors duration-300">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
    <span id="status-text">Conectado ao Servidor — Modo Online</span>
  </div>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md space-y-6">
      
      <!-- Cabeçalho / Logo -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/20 text-blue-400 border border-blue-500/30 mb-2 shadow-lg shadow-blue-500/10">
          <i class="fa-solid fa-truck-fast text-2xl"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Rota Inteligente</h1>
        <p class="text-sm text-slate-400">Sistema Integrado de Roteirização e Expedição</p>
      </div>

      <!-- Card do Formulário -->
      <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700/60 p-6 sm:p-8 shadow-2xl space-y-6">
        
        <!-- Seleção de Perfil (Tabs) -->
        <div class="grid grid-cols-2 gap-1 p-1 bg-slate-900/80 rounded-xl border border-slate-700/50">
          <button type="button" id="tab-expedicao" onclick="selectRole('expedicao')" class="py-2.5 text-xs font-medium rounded-lg transition-all duration-200 flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm">
            <i class="fa-solid fa-industry text-xs"></i>
            Expedição
          </button>
          <button type="button" id="tab-motorista" onclick="selectRole('motorista')" class="py-2.5 text-xs font-medium rounded-lg transition-all duration-200 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-id-card text-xs"></i>
            Motorista
          </button>
        </div>

        <!-- Formulário de Autenticação -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
          
          <!-- Campo Usuário / Matrícula -->
          <div class="space-y-1.5">
            <label id="user-label" class="text-xs font-medium text-slate-300 block">Usuário ou E-mail</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-user text-sm"></i>
              </span>
              <input type="text" id="username" required placeholder="Digite seu usuário" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
            </div>
          </div>

          <!-- Campo Senha -->
          <div class="space-y-1.5">
            <label class="text-xs font-medium text-slate-300 block">Senha de Acesso</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-lock text-sm"></i>
              </span>
              <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
              <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200">
                <i id="eye-icon" class="fa-solid fa-eye text-sm"></i>
              </button>
            </div>
          </div>

          <!-- Opções Adicionais -->
          <div class="flex items-center justify-between text-xs pt-1">
            <label class="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-blue-500 focus:ring-offset-slate-800">
              Lembrar acesso
            </label>
            <a href="#" onclick="alert('Entre em contato com o administrador do sistema para redefinir sua senha.')" class="text-blue-400 hover:text-blue-300 transition-colors">Esqueceu a senha?</a>
          </div>

          <!-- Botão Entrar -->
          <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium text-sm rounded-xl shadow-lg shadow-blue-600/20 transition-all duration-200 flex items-center justify-center gap-2 mt-2">
            <span>Acessar o Sistema</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </form>

        <!-- Indicador de PWA Offline para Motorista -->
        <div id="offline-note" class="hidden p-3 rounded-xl bg-slate-900/60 border border-slate-700/40 text-xs text-slate-400 flex items-start gap-2.5">
          <i class="fa-solid fa-wifi text-blue-400 mt-0.5"></i>
          <span><strong>Modo Offline Ativo:</strong> O perfil de motorista permite visualizar rotas baixadas e confirmar entregas mesmo sem sinal de internet.</span>
        </div>

      </div>

      <!-- Rodapé -->
      <p class="text-center text-xs text-slate-500">
        Saga SENAI — Faculdade SENAI Fatesg
      </p>

    </div>
  </main>

  <script>
    let activeRole = 'expedicao';

    function selectRole(role) {
      activeRole = role;
      const tabExpedicao = document.getElementById('tab-expedicao');
      const tabMotorista = document.getElementById('tab-motorista');
      const userLabel = document.getElementById('user-label');
      const userInput = document.getElementById('username');
      const offlineNote = document.getElementById('offline-note');

      if (role === 'expedicao') {
        tabExpedicao.className = 'py-2.5 text-xs font-medium rounded-lg transition-all duration-200 flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm';
        tabMotorista.className = 'py-2.5 text-xs font-medium rounded-lg transition-all duration-200 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200';
        userLabel.innerText = 'Usuário ou E-mail';
        userInput.placeholder = 'Digite seu usuário';
        offlineNote.classList.add('hidden');
      } else {
        tabMotorista.className = 'py-2.5 text-xs font-medium rounded-lg transition-all duration-200 flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm';
        tabExpedicao.className = 'py-2.5 text-xs font-medium rounded-lg transition-all duration-200 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200';
        userLabel.innerText = 'Matrícula do Motorista';
        userInput.placeholder = 'Ex: MOT-1042';
        offlineNote.classList.remove('hidden');
      }
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.className = 'fa-solid fa-eye-slash text-sm';
      } else {
        passwordInput.type = 'password';
        eyeIcon.className = 'fa-solid fa-eye text-sm';
      }
    }

    // Redirecionamento correto conforme o perfil selecionado
    function handleLogin(e) {
      e.preventDefault();
      if (activeRole === 'expedicao') {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'motorista.html';
      }
    }

    // Monitoramento do estado de rede (Online / Offline)
    function updateOnlineStatus() {
      const statusBar = document.getElementById('status-bar');
      const statusText = document.getElementById('status-text');
      if (navigator.onLine) {
        statusBar.className = 'w-full py-1.5 px-4 text-xs font-semibold text-center flex items-center justify-center gap-2 bg-emerald-950 text-emerald-300 border-b border-emerald-800 transition-colors duration-300';
        statusText.innerText = 'Conectado ao Servidor — Modo Online';
      } else {
        statusBar.className = 'w-full py-1.5 px-4 text-xs font-semibold text-center flex items-center justify-center gap-2 bg-amber-950 text-amber-300 border-b border-amber-800 transition-colors duration-300';
        statusText.innerText = 'Sem Conexão com a Internet — Modo Offline (Dados Salvos Localmente)';
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>
</html>
